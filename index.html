<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dynamic Theme-Aware Favicons -->
    <link id="favicon-dark" rel="icon" type="image/png" href="/icond.png" media="(prefers-color-scheme: dark)" />
    <link id="favicon-light" rel="icon" type="image/png" href="/iconl.png" media="(prefers-color-scheme: light)" />
    <link id="favicon-default" rel="icon" type="image/png" href="/iconl.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("aiverse_theme");
          var isDark = saved === "amoled" || (!saved || saved === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var href = isDark ? "/icond.png" : "/iconl.png";
          var links = document.querySelectorAll("link[rel*='icon']");
          links.forEach(function(l) {
            l.removeAttribute("media");
            l.href = href;
          });
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Basic SEO -->
    <meta name="description" content="AiVerse is a comprehensive AI Knowledge Encyclopedia. Explore the latest in Artificial Intelligence, machine learning, neural networks, and more." />
    <meta name="keywords" content="AI, Artificial Intelligence, Machine Learning, Encyclopedia, Neural Networks, Technology" />
    <meta name="author" content="AiVerse" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aiverse.frozenn.in/" />
    <meta property="og:title" content="AiVerse - AI Knowledge Encyclopedia" />
    <meta property="og:description" content="Explore the definitive AI Knowledge Encyclopedia. Discover machine learning, neural networks, and the future of technology." />
    <meta property="og:image" content="/card.png" />

    <!-- Twitter / Social Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aiverse.frozenn.in/" />
    <meta property="twitter:title" content="AiVerse - AI Knowledge Encyclopedia" />
    <meta property="twitter:description" content="Explore the definitive AI Knowledge Encyclopedia. Discover machine learning, neural networks, and the future of technology." />
    <meta property="twitter:image" content="/card.png" />

    <!-- Advanced SEO & Agentic Resource Discovery -->
    <link rel="canonical" href="https://aiverse.frozenn.in/" />
    <link rel="ard" href="/.well-known/ard.json" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="language" content="English">
    
    <!-- Apple/Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AiVerse" />
    <meta name="application-name" content="AiVerse" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AiVerse",
      "url": "https://aiverse.frozenn.in/",
      "description": "Explore the definitive AI Knowledge Encyclopedia. Discover machine learning, neural networks, and the future of technology.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://aiverse.frozenn.in/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://iajivjjzfvkhullzfsom.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://iajivjjzfvkhullzfsom.supabase.co">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    
    <title>AiVerse - AI Knowledge Encyclopedia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
