name: AI Radar & Ecosystem Sync

on:
  schedule:
    # Runs 10 times per day (~every 2.4 hours) at 00:00, 02:00, 05:00, 07:00, 10:00, 12:00, 14:00, 17:00, 19:00, 22:00 UTC
    - cron: '0 0,2,5,7,10,12,14,17,19,22 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  ai-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI Radar Sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ai_radar.js

      - name: Commit and push AI radar intelligence updates
        run: |
          git config --local user.name "Sabareesh G"
          git config --local user.email "sabareeshgm47@gmail.com"
          export GIT_AUTHOR_NAME="Sabareesh G"
          export GIT_AUTHOR_EMAIL="sabareeshgm47@gmail.com"
          export GIT_COMMITTER_NAME="Sabareesh G"
          export GIT_COMMITTER_EMAIL="sabareeshgm47@gmail.com"
          git add src/data.ts public/data/ AI_RADAR.md README.md supabase/seed_entries.sql
          if git diff --staged --quiet; then
            echo "No updates to commit."
          else
            if [ -f public/data/latest_added_model.txt ] && [ -s public/data/latest_added_model.txt ]; then
              MODEL_NAME=$(cat public/data/latest_added_model.txt)
              git commit -m "chore(radar): queue ${MODEL_NAME} for review & sync AI radar [skip ci]"
            else
              git commit -m "chore(radar): sync AI trends, catalog metrics & ecosystem health [skip ci]"
            fi
            git pull --rebase origin ${GITHUB_REF#refs/heads/} || true
            git push origin HEAD:${{ github.ref }}
          fi
